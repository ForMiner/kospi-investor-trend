name: Fetch KOSPI investor data

# This workflow does the three things the Claude cloud routine cannot: it reaches
# finance.naver.com, it reaches api.telegram.org, and it has a browser to render
# the report with. The routine's sandbox sits behind an allowlist egress proxy
# that refuses the first two with 403, so scraping and notifying both live here;
# the routine only renders the committed CSV and republishes the artifact.

on:
  schedule:
    # 22:50 UTC Sun-Thu = 07:50 KST Mon-Fri, ten minutes before the routine runs.
    - cron: "50 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-kospi
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest trading days
        run: |
          set -o pipefail
          python3 fetch_kospi.py --months 14 2>&1 | tee /tmp/fetch.log

      - name: Commit CSV if it changed
        run: |
          if git diff --quiet -- data/kospi_investor_daily.csv; then
            echo "No new trading days; nothing to commit."
            exit 0
          fi
          latest=$(tail -n 1 data/kospi_investor_daily.csv | cut -d, -f1 | tr -d '"')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kospi_investor_daily.csv
          git commit -m "Update KOSPI investor data through ${latest}"
          git push

      # Screenshot the very page the artifact serves, so the image in Telegram and
      # the page on claude.ai can never drift apart.
      - name: Render the report to PNG
        run: |
          for bin in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$bin" >/dev/null 2>&1; then CHROME="$bin"; break; fi
          done
          if [ -z "${CHROME:-}" ]; then
            echo "::error::No Chrome or Chromium on this runner."
            exit 1
          fi
          echo "Using $CHROME"

          # virtual-time-budget lets the chart JS finish before the shot is taken;
          # device-scale-factor 2 keeps 11px axis labels readable after Telegram
          # re-encodes the image. The height must clear the whole document —
          # measured at 1815px for a 1000px-wide viewport — or the last chart
          # is silently cut off.
          "$CHROME" --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
            --virtual-time-budget=15000 \
            --force-device-scale-factor=2 \
            --window-size=1000,1840 \
            --screenshot=/tmp/kospi.png \
            "file://$PWD/dist/index.html"

          if [ ! -s /tmp/kospi.png ]; then
            echo "::error::Screenshot came out empty."
            exit 1
          fi
          ls -lh /tmp/kospi.png

      # The caption text is built by fetch_kospi.py (the NOTIFY line) so the Korean
      # wording and number formatting live in one place.
      - name: Send the chart to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTIFACT_URL: https://claude.ai/code/artifact/8b267dfc-73b4-4100-9cb6-66661250a454
        run: |
          # Fail rather than skip: a silently-skipped notification is
          # indistinguishable from a delivered one on the runs page.
          echo "TELEGRAM_BOT_TOKEN present: $([ -n "$TOKEN" ] && echo yes || echo NO)"
          echo "TELEGRAM_CHAT_ID present:   $([ -n "$CHAT_ID" ] && echo yes || echo NO)"
          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::error::Telegram secrets are missing on this repository."
            exit 1
          fi

          line=$(grep '^NOTIFY ' /tmp/fetch.log | tail -n 1 | cut -d' ' -f2-)
          if [ -z "$line" ]; then
            echo "::error::No NOTIFY line in the fetch output."
            exit 1
          fi

          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendPhoto" \
            -F "chat_id=${CHAT_ID}" \
            -F "photo=@/tmp/kospi.png" \
            -F "caption=${line}"$'\n'"${ARTIFACT_URL}" \
            -o /tmp/telegram.json

          # Telegram answers 200 with {"ok":false,...} on a bad token or chat_id,
          # so the status code alone is not enough to call this a success.
          if ! grep -q '"ok":true' /tmp/telegram.json; then
            echo "::error::Telegram rejected the message."
            cat /tmp/telegram.json
            exit 1
          fi
          echo "Sent: ${line}"
